<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
    <defs>
        <radialGradient id="beanGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#4a3728"/>
            <stop offset="45%" stop-color="#2a1a10"/>
            <stop offset="90%" stop-color="#120a05"/>
            <stop offset="100%" stop-color="#080402"/>
        </radialGradient>
        <filter id="beanShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
        </filter>
    </defs>
    <g filter="url(#beanShadow)">
        <!-- Bean Body -->
        <path d="M 50 12 C 75 12, 90 28, 88 52 C 86 76, 70 90, 48 88 C 26 86, 12 70, 12 48 C 12 26, 25 12, 50 12 Z" fill="url(#beanGrad)"/>
        
        <!-- Center Crease (S-curve) -->
        <path d="M 50 16 C 54 30, 42 42, 52 54 C 62 66, 48 78, 48 84" stroke="#060301" stroke-width="5" stroke-linecap="round"/>
        <path d="M 50 16 C 54 30, 42 42, 52 54 C 62 66, 48 78, 48 84" stroke="#7a5c43" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

        <!-- Gloss Highlight -->
        <path d="M 32 24 C 42 18, 56 18, 64 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
        <ellipse cx="72" cy="45" rx="5" ry="12" transform="rotate(20 72 45)" fill="#ffffff" opacity="0.15"/>
    </g>
</svg>
