<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="cinnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5a3824"/>
            <stop offset="40%" stop-color="#3c2014"/>
            <stop offset="80%" stop-color="#24120a"/>
            <stop offset="100%" stop-color="#140804"/>
        </linearGradient>
        <filter id="cinnShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>
    <g filter="url(#cinnShadow)" transform="rotate(-25 60 60)">
        <!-- Rolled Cinnamon Cylinder -->
        <path d="M 25 35 L 85 85 L 95 75 L 35 25 Z" fill="url(#cinnGrad)"/>
        <!-- Cinnamon End Spiral -->
        <ellipse cx="30" cy="30" rx="9" ry="6" transform="rotate(40 30 30)" fill="#351a0c" stroke="#6b442d" stroke-width="2"/>
        <path d="M 28 28 A 4 3 0 1 0 32 32" stroke="#8a5a3d" stroke-width="1.5" fill="none"/>
        <!-- Bark Longitudinal Ridges -->
        <line x1="33" y1="28" x2="93" y2="78" stroke="#6b442d" stroke-width="1.5" opacity="0.6"/>
        <line x1="26" y1="34" x2="86" y2="84" stroke="#1f0c05" stroke-width="2" opacity="0.8"/>
        <!-- Specular Highlight -->
        <line x1="32" y1="30" x2="90" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
    </g>
</svg>
