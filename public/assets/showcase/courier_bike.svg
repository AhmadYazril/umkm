    <circle cx="16" cy="46" r="4" fill="#191919"/>
    <circle cx="48" cy="46" r="10" stroke="#191919" stroke-width="4" fill="#ffffff"/>
    <circle cx="48" cy="46" r="4" fill="#191919"/>

    <!-- Scooter Frame -->
    <path d="M 16 46 L 28 46 L 36 34 L 46 34 L 48 46" stroke="#191919" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 38 34 L 44 20 L 40 20" stroke="#191919" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="22" r="2.5" fill="#f0f0f0"/>

    <!-- Delivery Box on Back -->
    <rect x="18" y="24" width="16" height="15" rx="3" fill="#191919" stroke="#333333" stroke-width="1.5"/>
    <path d="M 23 30 L 29 30" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
