<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
    <defs>
        <radialGradient id="milkDrop" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#faf7f2"/>
            <stop offset="90%" stop-color="#ded8cc"/>
            <stop offset="100%" stop-color="#bfb5a3"/>
        </radialGradient>
        <filter id="milkShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
        </filter>
    </defs>
    <g filter="url(#milkShadow)">
        <!-- Fluid Drop Shape -->
        <path d="M 50 14 
                 C 50 14, 76 52, 76 68 
                 C 76 82, 64 90, 50 90 
                 C 36 90, 24 82, 24 68 
                 C 24 52, 50 14, 50 14 Z" fill="url(#milkDrop)"/>
        <!-- Crown / Droplet Crown Splash Accent -->
        <circle cx="78" cy="32" r="5" fill="url(#milkDrop)"/>
        <circle cx="22" cy="40" r="3.5" fill="url(#milkDrop)"/>
        <!-- Specular Highlight Curve -->
        <path d="M 38 52 C 34 62, 36 74, 44 80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
        <circle cx="44" cy="42" r="3" fill="#ffffff" opacity="0.9"/>
    </g>
</svg>
