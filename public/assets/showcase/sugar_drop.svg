<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
    <defs>
        <radialGradient id="sugarDrop" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#7a441e"/>
            <stop offset="45%" stop-color="#4a240c"/>
            <stop offset="85%" stop-color="#241004"/>
            <stop offset="100%" stop-color="#0e0501"/>
        </radialGradient>
        <filter id="sugarShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="2" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>
    <g filter="url(#sugarShadow)" transform="rotate(-15 50 50)">
        <path d="M 50 12 
                 C 50 12, 78 50, 78 68 
                 C 78 84, 65 92, 50 92 
                 C 35 92, 22 84, 22 68 
                 C 22 50, 50 12, 50 12 Z" fill="url(#sugarDrop)"/>
        <!-- Amber Translucent Rim -->
        <path d="M 50 12 C 50 12, 78 50, 78 68 C 78 84, 65 92, 50 92 C 35 92, 22 84, 22 68 C 22 50, 50 12, 50 12 Z" stroke="#a2632e" stroke-width="1.5" opacity="0.6"/>
        <!-- Specular Highlight Curve -->
        <path d="M 34 50 C 30 62, 34 76, 44 82" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
        <circle cx="42" cy="38" r="2.5" fill="#ffffff" opacity="0.8"/>
    </g>
</svg>
