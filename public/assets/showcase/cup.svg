<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%" fill="none">
    <defs>
        <!-- Glass reflections and liquid gradients -->
        <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1"/>
            <stop offset="85%" stop-color="#ffffff" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
        </linearGradient>

        <linearGradient id="coffeeLayer" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#14110e"/>
            <stop offset="35%" stop-color="#2d221a"/>
            <stop offset="65%" stop-color="#4a3b2c"/>
            <stop offset="85%" stop-color="#69533d"/>
            <stop offset="100%" stop-color="#8a7359"/>
        </linearGradient>

        <linearGradient id="milkSwirl" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="40%" stop-color="#f5f2eb"/>
            <stop offset="80%" stop-color="#ded8cc"/>
            <stop offset="100%" stop-color="#b8aa97"/>
        </linearGradient>

        <linearGradient id="arenLayer" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4a2810"/>
            <stop offset="50%" stop-color="#281406"/>
            <stop offset="100%" stop-color="#120902"/>
        </linearGradient>

        <linearGradient id="iceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#e8f0f8" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
        </linearGradient>

        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <filter id="cupShadow" x="-30%" y="-20%" width="160%" height="150%">
            <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Glass Cup Outer with Drop Shadow -->
    <g filter="url(#cupShadow)">
        <!-- Straw (Rear Part) -->
        <rect x="180" y="25" width="14" height="230" rx="7" transform="rotate(14 180 25)" fill="#202020"/>
        <rect x="182" y="25" width="4" height="230" rx="2" transform="rotate(14 180 25)" fill="#666666"/>

        <!-- Glass Cup Shape -->
        <!-- Rim -->
        <ellipse cx="160" cy="110" rx="76" ry="16" fill="#f8f8f8" stroke="#d5d5d5" stroke-width="2"/>

        <!-- Glass Wall Clip Path -->
        <clipPath id="glassClip">
            <path d="M 86 110 L 104 380 Q 106 405 160 405 Q 214 405 216 380 L 234 110 Z"/>
        </clipPath>

        <!-- Liquid Layers Inside Glass -->
        <g clip-path="url(#glassClip)">
            <!-- Background base inside glass -->
            <rect x="70" y="100" width="180" height="320" fill="#201a14"/>

            <!-- Layer 1 (Bottom): Gula Aren Syrup Dense Base -->
            <path d="M 80 340 Q 120 330 160 345 Q 200 335 240 340 L 240 420 L 80 420 Z" fill="url(#arenLayer)"/>

            <!-- Layer 2 (Middle): Creamy Milk Marbling -->
            <path d="M 80 220 Q 130 250 160 210 Q 190 260 240 230 L 240 360 L 80 360 Z" fill="url(#milkSwirl)"/>
            <!-- Milk swirling tendrils -->
            <path d="M 110 340 Q 125 280 135 300 Q 145 320 155 260" stroke="#f5f2eb" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
            <path d="M 175 350 Q 185 270 190 290 Q 200 310 210 250" stroke="#f5f2eb" stroke-width="10" stroke-linecap="round" opacity="0.75"/>

            <!-- Layer 3 (Top): Dark Sendang Espresso Extraction -->
            <path d="M 80 110 L 240 110 L 240 235 Q 200 245 160 220 Q 120 250 80 225 Z" fill="url(#coffeeLayer)"/>

            <!-- Crema Froth Top Surface -->
            <ellipse cx="160" cy="116" rx="72" ry="14" fill="#a48866" opacity="0.95"/>
            <ellipse cx="160" cy="115" rx="68" ry="11" fill="#cbb393" opacity="0.7"/>

            <!-- Submerged Ice Cubes -->
            <g opacity="0.85">
                <!-- Ice Cube 1 -->
                <polygon points="120,135 155,128 170,150 135,160" fill="url(#iceGradient)" stroke="#ffffff" stroke-width="1"/>
                <polygon points="120,135 135,160 130,185 115,160" fill="#ffffff" fill-opacity="0.3"/>
                <polygon points="135,160 170,150 165,175 130,185" fill="#e0e8f0" fill-opacity="0.4"/>

                <!-- Ice Cube 2 -->
                <polygon points="165,145 195,140 205,165 175,172" fill="url(#iceGradient)" stroke="#ffffff" stroke-width="1"/>
                <polygon points="165,145 175,172 170,195 160,168" fill="#ffffff" fill-opacity="0.25"/>

                <!-- Ice Cube 3 (floating top) -->
                <polygon points="130,112 160,108 175,122 145,126" fill="url(#iceGradient)" stroke="#ffffff" stroke-width="1.2"/>
            </g>

            <!-- Straw inside liquid refraction -->
            <rect x="180" y="116" width="13" height="260" rx="6.5" transform="rotate(11 180 116)" fill="#ffffff" opacity="0.3"/>
        </g>

        <!-- Glass Highlight & Specular Reflections (Glossy Glass Look) -->
        <!-- Left Rim Reflection -->
        <path d="M 94 125 L 110 375 Q 112 390 125 395" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.55" filter="url(#softGlow)"/>
        <path d="M 94 125 L 110 375 Q 112 390 125 395" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

        <!-- Right Rim Highlight -->
        <path d="M 226 125 L 210 375" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

        <!-- Center Glass Glare Curved -->
        <path d="M 125 140 Q 135 250 142 360" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

        <!-- Glass Base Weight -->
        <path d="M 104 380 Q 106 405 160 405 Q 214 405 216 380 Q 214 395 160 395 Q 106 395 104 380 Z" fill="#ffffff" opacity="0.35"/>
        <ellipse cx="160" cy="398" rx="50" ry="7" fill="#000000" opacity="0.2"/>

        <!-- Glass Rim Top Overlay -->
        <ellipse cx="160" cy="110" rx="76" ry="16" fill="url(#glassBody)" stroke="#ffffff" stroke-width="1.5"/>

        <!-- Condensation Droplets on Glass Surface -->
        <circle cx="112" cy="190" r="2.5" fill="#ffffff" opacity="0.6"/>
        <circle cx="115" cy="225" r="3" fill="#ffffff" opacity="0.7"/>
        <circle cx="114" cy="265" r="2" fill="#ffffff" opacity="0.5"/>
        <circle cx="125" cy="310" r="3" fill="#ffffff" opacity="0.7"/>
        <circle cx="218" cy="210" r="2.5" fill="#ffffff" opacity="0.6"/>
        <circle cx="212" cy="280" r="3.5" fill="#ffffff" opacity="0.65"/>
    </g>
</svg>
