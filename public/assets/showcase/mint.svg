<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4d6b53"/>
            <stop offset="45%" stop-color="#2c4432"/>
            <stop offset="100%" stop-color="#142418"/>
        </linearGradient>
        <filter id="mintShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
        </filter>
    </defs>
    <g filter="url(#mintShadow)" transform="rotate(15 50 50)">
        <!-- Serrated leaf shape -->
        <path d="M 50 10 
                 C 65 22, 85 30, 84 55 
                 C 83 75, 62 88, 50 92 
                 C 38 88, 17 75, 16 55 
                 C 15 30, 35 22, 50 10 Z" fill="url(#mintGrad)"/>
        
        <!-- Central Vein -->
        <path d="M 50 12 L 50 92" stroke="#6b8e72" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Side Veins -->
        <path d="M 50 30 Q 64 26 74 34" stroke="#6b8e72" stroke-width="1.2" opacity="0.7"/>
        <path d="M 50 30 Q 36 26 26 34" stroke="#6b8e72" stroke-width="1.2" opacity="0.7"/>
        <path d="M 50 48 Q 66 45 76 54" stroke="#6b8e72" stroke-width="1.2" opacity="0.7"/>
        <path d="M 50 48 Q 34 45 24 54" stroke="#6b8e72" stroke-width="1.2" opacity="0.7"/>
        <path d="M 50 66 Q 64 66 70 74" stroke="#6b8e72" stroke-width="1.2" opacity="0.7"/>
        <path d="M 50 66 Q 36 66 30 74" stroke="#6b8e72" stroke-width="1.2" opacity="0.7"/>

        <!-- Leaf Tip Highlight -->
        <path d="M 48 18 Q 54 28 54 44" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </g>
</svg>
